<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Abstract mint evidence light field">
  <defs>
    <filter id="noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="4" seed="31" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.22"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <radialGradient id="mintA" cx="78%" cy="20%" r="62%">
      <stop offset="0" stop-color="#d6fff2"/>
      <stop offset="0.25" stop-color="#4be3cf"/>
      <stop offset="0.58" stop-color="#008b8f"/>
      <stop offset="1" stop-color="#020303" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintB" cx="17%" cy="73%" r="42%">
      <stop offset="0" stop-color="#90ffe1"/>
      <stop offset="0.45" stop-color="#008b8f"/>
      <stop offset="1" stop-color="#020303" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g filter="url(#noise)">
    <ellipse cx="850" cy="205" rx="380" ry="320" fill="url(#mintA)" opacity="0.9"/>
    <ellipse cx="250" cy="560" rx="330" ry="240" fill="url(#mintB)" opacity="0.78"/>
    <path d="M0 180 C210 235 350 390 570 380 C775 370 930 240 1200 270 L1200 760 L0 760Z" fill="#031816" opacity="0.72"/>
  </g>
</svg>
