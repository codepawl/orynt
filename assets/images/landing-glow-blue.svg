<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Abstract blue technical light field">
  <defs>
    <filter id="noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="17" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.22"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <radialGradient id="blueA" cx="72%" cy="44%" r="58%">
      <stop offset="0" stop-color="#35d7ff"/>
      <stop offset="0.28" stop-color="#005397"/>
      <stop offset="0.58" stop-color="#27106f"/>
      <stop offset="1" stop-color="#020303" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blueB" x1="70%" x2="38%" y1="15%" y2="87%">
      <stop offset="0" stop-color="#60f5ff" stop-opacity="0.92"/>
      <stop offset="0.34" stop-color="#005397" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#020303" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g filter="url(#noise)">
    <ellipse cx="790" cy="350" rx="420" ry="360" fill="url(#blueA)" opacity="0.95"/>
    <path d="M960 40 C1150 170 1100 420 905 520 C750 600 560 520 510 365 C450 180 670 -30 960 40Z" fill="url(#blueB)" opacity="0.82"/>
    <path d="M0 640 C310 560 430 700 720 610 C890 556 1005 442 1200 470 L1200 760 L0 760Z" fill="#051a2b" opacity="0.75"/>
  </g>
</svg>
