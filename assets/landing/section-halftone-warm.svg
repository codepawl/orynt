<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Warm halftone landing page section background</title>
  <desc id="desc">A warm abstract halftone section background with peach, yellow, coral, and cream dot fields.</desc>
  <defs>
    <linearGradient id="warmBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef9059"/>
      <stop offset="46%" stop-color="#f4c667"/>
      <stop offset="100%" stop-color="#f3b08d"/>
    </linearGradient>
    <radialGradient id="creamCloud" cx="60%" cy="22%" r="58%">
      <stop offset="0%" stop-color="#fff7ef"/>
      <stop offset="45%" stop-color="#f7c7f0"/>
      <stop offset="100%" stop-color="#f7c7f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="42%" cy="88%" r="55%">
      <stop offset="0%" stop-color="#f6ff18"/>
      <stop offset="42%" stop-color="#eebd32"/>
      <stop offset="100%" stop-color="#df5b1c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotVary" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tinyDots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.3" fill="url(#dotVary)"/>
    </pattern>
    <pattern id="squareDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="7" y="7" width="5" height="5" fill="#d36b28"/>
    </pattern>
    <pattern id="yellowDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="6" y="6" width="4.5" height="4.5" fill="#fbff2c"/>
    </pattern>
    <mask id="softLeft">
      <rect width="1920" height="1080" fill="black"/>
      <ellipse cx="350" cy="360" rx="620" ry="460" fill="white"/>
      <ellipse cx="730" cy="900" rx="680" ry="360" fill="white"/>
    </mask>
    <mask id="softRight">
      <rect width="1920" height="1080" fill="black"/>
      <ellipse cx="1380" cy="390" rx="690" ry="470" fill="white"/>
      <ellipse cx="1480" cy="930" rx="540" ry="260" fill="white"/>
    </mask>
  </defs>
  <rect width="1920" height="1080" fill="url(#warmBase)"/>
  <path d="M0 190 C290 120 430 240 610 360 C850 520 1070 430 1290 300 C1540 150 1750 130 1920 210 L1920 0 L0 0 Z" fill="url(#creamCloud)"/>
  <path d="M0 1080 L0 855 C310 790 530 770 820 880 C1080 980 1370 970 1920 790 L1920 1080 Z" fill="url(#sun)"/>
  <g opacity="0.66" mask="url(#softLeft)">
    <rect x="-120" y="-40" width="1120" height="720" fill="url(#tinyDots)"/>
    <rect x="-80" y="430" width="1200" height="650" fill="url(#yellowDots)" opacity="0.75"/>
  </g>
  <g opacity="0.58" mask="url(#softRight)">
    <rect x="720" y="-60" width="1280" height="700" fill="url(#tinyDots)"/>
    <rect x="1030" y="420" width="980" height="620" fill="url(#squareDots)" opacity="0.62"/>
  </g>
  <path d="M-80 600 C310 550 440 720 720 710 C1030 700 1200 520 1540 560 C1740 585 1830 690 2000 650 L2000 1120 L-80 1120 Z" fill="#f7e861" opacity="0.34"/>
  <path d="M1020 0 C1110 165 1200 230 1390 260 C1625 297 1770 420 1920 570 L1920 0 Z" fill="#fff8f5" opacity="0.48"/>
</svg>
