[project]
name = "codepawl-renderer"
version = "0.1.0"
description = "Local rendering harness package for CodePawl Design research."
requires-python = ">=3.11"
dependencies = [
    "codepawl-metrics",
    "playwright>=1.56.0",
]

[tool.uv.sources]
codepawl-metrics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
