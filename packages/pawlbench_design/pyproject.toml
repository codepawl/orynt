[project]
name = "pawlbench-design"
version = "0.1.0"
description = "Benchmark package placeholder for frontend design evaluation."
requires-python = ">=3.11"
dependencies = [
    "pillow>=12.0.0",
]

[project.optional-dependencies]
vision = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
