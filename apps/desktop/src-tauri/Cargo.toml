[package]
name = "codepawl-desktop"
version = "0.1.0"
description = "CodePawl Tauri desktop shell"
authors = ["CodePawl"]
edition = "2021"

[lib]
name = "codepawl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
