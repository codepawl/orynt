<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CodePawl Design Example</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
        color: #17202a;
        background: #f7f8fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      main {
        min-height: 100vh;
        display: grid;
        align-items: center;
        padding: 48px 20px;
      }

      .hero {
        width: min(960px, 100%);
        margin: 0 auto;
        display: grid;
        gap: 28px;
        grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
        align-items: center;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #1f6f5f;
        font-size: 0.84rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 12ch;
        font-size: clamp(2.4rem, 8vw, 5rem);
        line-height: 0.95;
      }

      .lede {
        max-width: 58ch;
        margin: 22px 0 0;
        color: #46515f;
        font-size: 1.08rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }

      a {
        color: inherit;
      }

      .button {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        padding: 0 18px;
        font-weight: 700;
        text-decoration: none;
      }

      .button.primary {
        color: #ffffff;
        background: #123c69;
      }

      .button.secondary {
        color: #123c69;
        border: 1px solid #aeb8c4;
        background: #ffffff;
      }

      .panel {
        border: 1px solid #d9dee7;
        border-radius: 8px;
        background: #ffffff;
        padding: 22px;
        box-shadow: 0 18px 48px rgba(18, 60, 105, 0.12);
      }

      .metric {
        display: grid;
        gap: 4px;
        padding: 14px 0;
        border-bottom: 1px solid #edf0f4;
      }

      .metric:last-child {
        border-bottom: 0;
      }

      .metric strong {
        font-size: 1.4rem;
      }

      .metric span {
        color: #5d6877;
      }

      @media (max-width: 760px) {
        main {
          align-items: start;
          padding-top: 36px;
        }

        .hero {
          grid-template-columns: 1fr;
        }

        h1 {
          max-width: 10ch;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Render harness fixture</p>
          <h1 id="page-title">CodePawl Design</h1>
          <p class="lede">
            A compact static page for future screenshot, DOM, accessibility, and metric collection tests.
          </p>
          <div class="actions" aria-label="Primary actions">
            <a class="button primary" href="#start">Start review</a>
            <a class="button secondary" href="#metrics">View metrics</a>
          </div>
        </div>
        <aside class="panel" aria-label="Example metrics" id="metrics">
          <div class="metric">
            <strong>3</strong>
            <span>planned artifact families</span>
          </div>
          <div class="metric">
            <strong>0</strong>
            <span>training loops in this scaffold</span>
          </div>
          <div class="metric">
            <strong>1</strong>
            <span>local harness milestone</span>
          </div>
        </aside>
      </section>
    </main>
  </body>
</html>
