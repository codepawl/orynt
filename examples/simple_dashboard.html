<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CodePawl Dashboard Example</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #14213d;
        background: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      main {
        min-height: 100vh;
        padding: 32px;
      }

      .shell {
        width: min(1040px, 100%);
        margin: 0 auto;
        display: grid;
        gap: 18px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      h1 {
        margin: 0;
        font-size: 2.8rem;
        line-height: 1;
      }

      p {
        margin: 8px 0 0;
        color: #4b5c73;
      }

      .button {
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        padding: 0 16px;
        color: #ffffff;
        background: #2457a6;
        font-weight: 700;
        text-decoration: none;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .panel {
        border: 1px solid #dce3ef;
        border-radius: 8px;
        background: #ffffff;
        padding: 20px;
      }

      .panel strong {
        display: block;
        font-size: 2rem;
      }

      .panel span {
        color: #596a80;
      }

      @media (max-width: 720px) {
        main {
          padding: 22px;
        }

        header,
        .grid {
          grid-template-columns: 1fr;
          display: grid;
        }

        h1 {
          font-size: 2.1rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="shell" aria-labelledby="dashboard-title">
        <header>
          <div>
            <h1 id="dashboard-title">Review Queue</h1>
            <p>Compact dashboard fixture for batch dataset generation.</p>
          </div>
          <a class="button" href="#queue">Start triage</a>
        </header>
        <div class="grid" id="queue">
          <article class="panel">
            <strong>12</strong>
            <span>open UI checks</span>
          </article>
          <article class="panel">
            <strong>4</strong>
            <span>contrast alerts</span>
          </article>
          <article class="panel">
            <strong>8</strong>
            <span>layout passes</span>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
