<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SparkNest Creator Tool</title>
    <style>
      :root{font-family:ui-sans-serif,system-ui,sans-serif;color:#22152b;background:#fff2fb}*{box-sizing:border-box}body{margin:0}main{min-height:100vh;padding:42px 22px;display:grid;align-items:center}.hero{width:min(1080px,100%);margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}.badge{display:inline-flex;background:#ffe15c;border:2px solid #22152b;border-radius:999px;padding:8px 12px;font-weight:900}h1{font-size:4.4rem;line-height:.98;margin:18px 0}.lede{font-size:1.16rem;line-height:1.65;color:#5b4068}.button{display:inline-flex;min-height:48px;align-items:center;padding:0 20px;border-radius:8px;background:#22152b;color:#fff;text-decoration:none;font-weight:900}.board{display:grid;gap:12px;transform:rotate(-1deg)}.note{background:white;border:2px solid #22152b;border-radius:8px;padding:18px;box-shadow:7px 7px 0 #ffc3e7}.note:nth-child(2){box-shadow:7px 7px 0 #b8f5dc}.note:nth-child(3){box-shadow:7px 7px 0 #ffe15c}.note strong{display:block;font-size:1.2rem}@media(max-width:800px){.hero{grid-template-columns:1fr}h1{font-size:3rem}.board{transform:none}}
    </style></head>
  <body><main><section class="hero" aria-labelledby="title"><div><span class="badge">Creator calendar</span><h1 id="title">Make every idea easier to ship.</h1><p class="lede">SparkNest turns raw clips, sketches, and campaign notes into a playful production board for independent creators.</p><a class="button" href="#board">Build schedule</a></div><aside class="board" id="board" aria-label="Content board"><div class="note"><strong>Idea stack</strong><span>14 concepts sorted by effort.</span></div><div class="note"><strong>Draft lane</strong><span>5 posts ready for polish.</span></div><div class="note"><strong>Launch list</strong><span>3 releases scheduled this week.</span></div></aside></section></main></body>
</html>
