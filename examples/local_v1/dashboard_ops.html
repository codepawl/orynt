<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Opsline Dashboard</title>
    <style>
      :root{font-family:ui-sans-serif,system-ui,sans-serif;color:#202124;background:#f5f5f4}*{box-sizing:border-box}body{margin:0}main{min-height:100vh;padding:28px}.shell{width:min(1180px,100%);margin:auto;display:grid;grid-template-columns:230px 1fr;gap:18px}.side,.panel{background:white;border:1px solid #dedbd4;border-radius:8px;padding:18px}.side a{display:block;color:#3f3f46;text-decoration:none;padding:10px;border-radius:6px}.side a:first-of-type{background:#e7f0ff;color:#164d9a;font-weight:800}.content{display:grid;gap:14px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric{font-size:2rem;font-weight:900}.queue{display:grid;gap:10px}.item{display:flex;justify-content:space-between;padding:12px;border-radius:6px;background:#f7f7f5}.muted{color:#62646a}@media(max-width:860px){.shell,.cards{grid-template-columns:1fr}}
    </style></head>
  <body><main><section class="shell" aria-labelledby="title"><nav class="side" aria-label="Ops navigation"><strong>Opsline</strong><a href="#queue">Queue</a><a href="#routes">Routes</a><a href="#staff">Staff</a></nav><div class="content"><div><h1 id="title">Operations control room</h1><p class="muted">Live status for service teams and open incidents.</p></div><div class="cards"><article class="panel"><span class="muted">Open jobs</span><div class="metric">43</div></article><article class="panel"><span class="muted">Delayed</span><div class="metric">6</div></article><article class="panel"><span class="muted">On time</span><div class="metric">91%</div></article></div><article class="panel queue" id="queue"><h2>Priority queue</h2><div class="item"><span>North route reschedule</span><strong>High</strong></div><div class="item"><span>Parts confirmation</span><strong>Medium</strong></div><div class="item"><span>Close completed work</span><strong>Low</strong></div></article></div></section></main></body>
</html>
