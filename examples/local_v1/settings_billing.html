<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Billing Settings</title>
    <style>
      :root{font-family:ui-sans-serif,system-ui,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}main{min-height:100vh;padding:30px}.shell{width:min(1080px,100%);margin:auto;display:grid;gap:16px}.top{display:flex;justify-content:space-between}.button{display:inline-flex;min-height:42px;align-items:center;padding:0 16px;border-radius:6px;background:#124e78;color:white;text-decoration:none;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{background:white;border:1px solid #d8e1ec;border-radius:8px;padding:18px}.price{font-size:2rem;font-weight:900}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #edf1f5}.row:last-child{border-bottom:0}.muted{color:#5b6678}@media(max-width:820px){.grid{grid-template-columns:1fr}.top{display:block}}
