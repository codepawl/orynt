<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gridwell Data Platform</title>
    <style>
      :root{font-family:ui-sans-serif,system-ui,sans-serif;color:#17202a;background:#eef2f7}*{box-sizing:border-box}body{margin:0}main{min-height:100vh;padding:44px 24px;display:grid;align-items:center}.hero{width:min(1140px,100%);margin:auto;display:grid;grid-template-columns:1fr 1.05fr;gap:32px;align-items:center}h1{font-size:4.2rem;line-height:1;margin:0 0 18px}.lede{font-size:1.13rem;line-height:1.7;color:#4d5b6b}.button{display:inline-flex;min-height:46px;align-items:center;padding:0 18px;border-radius:6px;background:#0f4c81;color:white;text-decoration:none;font-weight:800}.diagram{background:white;border:1px solid #d4dde9;border-radius:8px;padding:20px}.lane{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid #edf1f5}.lane:last-child{border-bottom:0}.label{font-weight:900;color:#0f4c81}.bar{height:32px;border-radius:6px;background:#dcecff}.bar:nth-child(2){background:#cfe7df}.stack{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.mini{padding:12px;border-radius:6px;background:#f6f8fb}@media(max-width:820px){.hero{grid-template-columns:1fr}h1{font-size:3rem}}
    </style></head>
  <body><main><section class="hero" aria-labelledby="title"><div><p class="label">Data reliability</p><h1 id="title">Pipeline health in one calm surface.</h1><p class="lede">Gridwell gives analytics teams a shared view of freshness, quality checks, and ownership before dashboards drift.</p><a class="button" href="#diagram">Inspect flows</a></div><aside class="diagram" id="diagram" aria-label="Pipeline diagram"><div class="lane"><span class="label">Ingest</span><div class="bar"></div></div><div class="lane"><span class="label">Validate</span><div class="bar"></div></div><div class="lane"><span class="label">Publish</span><div class="bar"></div></div><div class="stack"><div class="mini">98% fresh</div><div class="mini">12 checks</div><div class="mini">4 owners</div></div></aside></section></main></body>
</html>
