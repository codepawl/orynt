<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sentinel Desk</title>
    <style>
      :root{font-family:ui-sans-serif,system-ui,sans-serif;color:#e5edf6;background:#0f172a}*{box-sizing:border-box}body{margin:0}main{min-height:100vh;padding:28px}.shell{width:min(1180px,100%);margin:auto;display:grid;gap:14px}.top{display:flex;justify-content:space-between;align-items:center}.button{background:#93c5fd;color:#0f172a;text-decoration:none;border-radius:6px;padding:11px 14px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.panel{background:#172033;border:1px solid #334155;border-radius:8px;padding:16px}.wide{grid-column:span 2}.metric{font-size:2rem;font-weight:900;color:white}.muted{color:#b6c2d1}.event{display:flex;justify-content:space-between;padding:12px;background:#111827;border-radius:6px;margin-top:10px}@media(max-width:860px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.top{display:block}}
    </style></head>
  <body><main><section class="shell" aria-labelledby="title"><div class="top"><div><h1 id="title">Security posture</h1><p class="muted">Identity and endpoint signals for the last 24 hours.</p></div><a class="button" href="#events">Triage events</a></div><div class="grid"><article class="panel"><span class="muted">Critical</span><div class="metric">2</div></article><article class="panel"><span class="muted">Warnings</span><div class="metric">18</div></article><article class="panel"><span class="muted">Coverage</span><div class="metric">96%</div></article><article class="panel"><span class="muted">Reviewed</span><div class="metric">74</div></article><article class="panel wide" id="events"><h2>Recent events</h2><div class="event"><span>New admin grant</span><strong>Review</strong></div><div class="event"><span>Unknown device</span><strong>Block</strong></div></article><article class="panel wide"><h2>Policy notes</h2><p class="muted">Two teams need quarterly access review by Friday.</p></article></div></section></main></body>
</html>
