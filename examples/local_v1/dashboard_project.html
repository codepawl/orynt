<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Project Slate</title>
    <style>
      :root{font-family:ui-sans-serif,system-ui,sans-serif;color:#1f2937;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}main{min-height:100vh;padding:28px}.shell{width:min(1180px,100%);margin:auto;display:grid;gap:16px}.top{display:flex;justify-content:space-between}.button{background:#364fc7;color:white;text-decoration:none;border-radius:6px;padding:11px 14px;font-weight:800}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.lane{background:white;border:1px solid #d8e0eb;border-radius:8px;padding:14px}.task{background:#f8fafc;border:1px solid #e2e8f0;border-radius:7px;padding:12px;margin-top:10px}.task strong{display:block}.muted{color:#64748b}@media(max-width:900px){.board{grid-template-columns:1fr}.top{display:block}}
    </style></head>
  <body><main><section class="shell" aria-labelledby="title"><div class="top"><div><h1 id="title">Launch project board</h1><p class="muted">Track scope, design, build, and review work.</p></div><a class="button" href="#board">Add task</a></div><div class="board" id="board"><section class="lane"><h2>Plan</h2><article class="task"><strong>Finalize goals</strong><span>Owner: Mira</span></article></section><section class="lane"><h2>Design</h2><article class="task"><strong>Review pricing page</strong><span>Due tomorrow</span></article></section><section class="lane"><h2>Build</h2><article class="task"><strong>Implement settings</strong><span>2 files changed</span></article></section><section class="lane"><h2>Ship</h2><article class="task"><strong>QA checklist</strong><span>7 items left</span></article></section></div></section></main></body>
</html>
