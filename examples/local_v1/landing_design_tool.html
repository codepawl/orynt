<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Framewise Design Tool</title>
    <style>
      :root{font-family:ui-sans-serif,system-ui,sans-serif;color:#18181b;background:#fafafa}*{box-sizing:border-box}body{margin:0}main{min-height:100vh;padding:44px 24px}.hero{width:min(1120px,100%);margin:auto;display:grid;grid-template-columns:.95fr 1.05fr;gap:32px;align-items:center}.eyebrow{font-weight:900;color:#7c3aed}.title{font-size:4.4rem;line-height:1;margin:12px 0}.lede{font-size:1.14rem;line-height:1.7;color:#52525b}.button{display:inline-flex;min-height:46px;align-items:center;padding:0 18px;border-radius:6px;background:#18181b;color:white;text-decoration:none;font-weight:800}.canvas{background:white;border:1px solid #dedede;border-radius:8px;padding:18px;display:grid;gap:14px}.toolbar{display:flex;gap:8px}.tool{width:34px;height:34px;border-radius:6px;background:#ede9fe;border:1px solid #c4b5fd}.layout{display:grid;grid-template-columns:1fr 1fr;gap:12px}.block{min-height:110px;border-radius:7px;background:#f4f4f5;border:1px solid #e4e4e7;padding:14px}.block strong{display:block}@media(max-width:820px){.hero,.layout{grid-template-columns:1fr}.title{font-size:3rem}}
    </style></head>
  <body><main><section class="hero" aria-labelledby="title"><div><p class="eyebrow">Design QA</p><h1 class="title" id="title">Review interface quality before handoff.</h1><p class="lede">Framewise checks spacing, hierarchy, contrast, and responsive structure in static previews.</p><a class="button" href="#canvas">Inspect frame</a></div><aside class="canvas" id="canvas" aria-label="Design canvas"><div class="toolbar"><span class="tool"></span><span class="tool"></span><span class="tool"></span></div><div class="layout"><div class="block"><strong>Hero block</strong><p>Hierarchy is strong.</p></div><div class="block"><strong>CTA group</strong><p>Contrast is passing.</p></div></div></aside></section></main></body>
</html>
