<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Account Settings</title>
    <style>
      :root{font-family:ui-sans-serif,system-ui,sans-serif;color:#1f2937;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}main{min-height:100vh;padding:30px}.shell{width:min(1040px,100%);margin:auto;display:grid;grid-template-columns:240px 1fr;gap:18px}.nav,.panel{background:white;border:1px solid #dce2ea;border-radius:8px;padding:18px}.nav a{display:block;color:#4b5563;text-decoration:none;padding:10px;border-radius:6px}.nav a:first-of-type{background:#eef2ff;color:#3730a3;font-weight:800}.form{display:grid;gap:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}label{font-weight:800}input{min-height:42px;border:1px solid #cbd5e1;border-radius:6px;padding:0 12px;font:inherit}.button{justify-self:start;min-height:42px;border:0;border-radius:6px;background:#3730a3;color:white;font-weight:800;padding:0 16px}@media(max-width:820px){.shell,.row{grid-template-columns:1fr}}
    </style></head>
  <body><main><section class="shell" aria-labelledby="title"><nav class="nav" aria-label="Settings"><strong>Settings</strong><a href="#account">Account</a><a href="#team">Team</a><a href="#security">Security</a></nav><div class="panel" id="account"><h1 id="title">Account profile</h1><p>Keep personal details and workspace identity current.</p><form class="form"><div class="row"><div class="field"><label for="name">Name</label><input id="name" value="Avery Lane"></div><div class="field"><label for="role">Role</label><input id="role" value="Product lead"></div></div><div class="field"><label for="email">Email</label><input id="email" value="avery@example.test"></div><button class="button" type="button">Save changes</button></form></div></section></main></body>
</html>
