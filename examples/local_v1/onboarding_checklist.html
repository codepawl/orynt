<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Onboarding Checklist</title>
    <style>
      :root{font-family:ui-sans-serif,system-ui,sans-serif;color:#1e293b;background:#eef6ff}*{box-sizing:border-box}body{margin:0}main{min-height:100vh;display:grid;align-items:center;padding:34px 24px}.wrap{width:min(900px,100%);margin:auto;background:white;border:1px solid #d5e3f2;border-radius:8px;padding:26px}h1{font-size:3.2rem;line-height:1;margin:0 0 10px}.lede{color:#5f6f82;line-height:1.7}.steps{display:grid;gap:12px;margin-top:22px}.step{display:grid;grid-template-columns:42px 1fr auto;gap:14px;align-items:center;border:1px solid #e2e8f0;border-radius:8px;padding:14px}.num{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#dbeafe;color:#1d4ed8;font-weight:900}.button{display:inline-flex;min-height:40px;align-items:center;padding:0 14px;border-radius:6px;background:#1d4ed8;color:white;text-decoration:none;font-weight:800}@media(max-width:700px){.step{grid-template-columns:42px 1fr}h1{font-size:2.5rem}.button{grid-column:2}}
    </style></head>
  <body><main><section class="wrap" aria-labelledby="title"><h1 id="title">Set up your review workspace.</h1><p class="lede">Finish these steps to create a repeatable design quality loop for your team.</p><div class="steps"><div class="step"><span class="num">1</span><div><strong>Create project</strong><p>Add a name and default viewport.</p></div><a class="button" href="#project">Start</a></div><div class="step"><span class="num">2</span><div><strong>Upload preview</strong><p>Attach a static HTML page for review.</p></div><a class="button" href="#upload">Upload</a></div><div class="step"><span class="num">3</span><div><strong>Invite teammate</strong><p>Share report ownership.</p></div><a class="button" href="#invite">Invite</a></div></div></section></main></body>
</html>
