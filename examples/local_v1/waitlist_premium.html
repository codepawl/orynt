<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Aurum Desk Waitlist</title>
    <style>
      :root{font-family:Georgia,serif;color:#f8ead7;background:#17110b}*{box-sizing:border-box}body{margin:0}main{min-height:100vh;padding:46px 24px;display:grid;align-items:center}.wrap{width:min(980px,100%);margin:auto;display:grid;grid-template-columns:1fr .8fr;gap:32px;align-items:center}.kicker{font-family:ui-sans-serif,system-ui,sans-serif;color:#e8bf78;text-transform:uppercase;font-weight:900}h1{font-size:4.4rem;line-height:1;margin:12px 0}.lede{font-family:ui-sans-serif,system-ui,sans-serif;color:#dfcfbd;line-height:1.7;font-size:1.1rem}.panel{border:1px solid #6f5534;border-radius:8px;background:#21170f;padding:22px}.field{display:grid;gap:8px;margin-bottom:14px}label{font-family:ui-sans-serif,system-ui,sans-serif;font-weight:800}input{min-height:44px;border:1px solid #80613a;border-radius:6px;background:#17110b;color:#f8ead7;padding:0 12px}button{min-height:44px;border:0;border-radius:6px;background:#e8bf78;color:#17110b;font-weight:900;padding:0 16px}@media(max-width:780px){.wrap{grid-template-columns:1fr}h1{font-size:3rem}}
    </style></head>
  <body><main><section class="wrap" aria-labelledby="title"><div><p class="kicker">Private beta</p><h1 id="title">Concierge planning for high-touch teams.</h1><p class="lede">Aurum Desk brings sensitive client work, approvals, and timelines into one careful operating surface.</p></div><form class="panel"><div class="field"><label for="email">Work email</label><input id="email" placeholder="name@example.test"></div><div class="field"><label for="team">Team size</label><input id="team" placeholder="12"></div><button type="button">Request access</button></form></section></main></body>
</html>
