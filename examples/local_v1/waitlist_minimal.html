<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QuietList Waitlist</title>
    <style>
      :root{font-family:ui-sans-serif,system-ui,sans-serif;color:#202124;background:#fafafa}*{box-sizing:border-box}body{margin:0}main{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(640px,100%);text-align:center}.label{font-weight:900;color:#52525b}h1{font-size:4rem;line-height:1;margin:14px 0}.lede{font-size:1.1rem;line-height:1.7;color:#5f6368}.form{display:flex;gap:10px;margin-top:28px;background:white;border:1px solid #d4d4d8;border-radius:8px;padding:8px}input{flex:1;border:0;font:inherit;padding:0 10px;min-width:0}button{border:0;border-radius:6px;background:#202124;color:white;font:inherit;font-weight:800;padding:0 16px;min-height:42px}.note{margin-top:16px;color:#71717a}@media(max-width:620px){.form{display:grid}h1{font-size:3rem}}
    </style></head>
  <body><main><section class="card" aria-labelledby="title"><p class="label">Launching soon</p><h1 id="title">A calmer inbox for team decisions.</h1><p class="lede">QuietList is a lightweight workspace for collecting decisions, owners, and follow-up notes.</p><form class="form"><input aria-label="Email address" placeholder="you@example.test"><button type="button">Join waitlist</button></form><p class="note">No spam. Early invites roll out in small batches.</p></section></main></body>
</html>
