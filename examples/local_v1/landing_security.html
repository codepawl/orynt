<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HarborLock Security</title>
    <style>
      :root{font-family:ui-sans-serif,system-ui,sans-serif;color:#eaf2ff;background:#111827}*{box-sizing:border-box}body{margin:0}main{min-height:100vh;padding:48px 24px}.hero{width:min(1100px,100%);margin:auto;display:grid;grid-template-columns:1.05fr .95fr;gap:32px;align-items:center}.mark{color:#8dd7ff;font-weight:900;text-transform:uppercase}.title{font-size:4.5rem;line-height:.98;margin:12px 0}.lede{font-size:1.12rem;line-height:1.7;color:#c6d3e1}.button{display:inline-flex;min-height:46px;align-items:center;padding:0 18px;border-radius:6px;background:#8dd7ff;color:#101826;text-decoration:none;font-weight:900}.panel{border:1px solid #334155;border-radius:8px;background:#172033;padding:20px}.signal{display:flex;justify-content:space-between;gap:18px;padding:14px;border-radius:7px;background:#111827;margin-bottom:10px}.signal span{color:#aab8ca}.score{color:#8dd7ff;font-weight:900}@media(max-width:800px){.hero{grid-template-columns:1fr}.title{font-size:3rem}}
    </style></head>
  <body><main><section class="hero" aria-labelledby="title"><div><p class="mark">Access review</p><h1 class="title" id="title">Find risky permissions before they spread.</h1><p class="lede">HarborLock maps users, systems, and sensitive actions into a daily queue security teams can actually finish.</p><a class="button" href="#risk">Review risk</a></div><aside class="panel" id="risk" aria-label="Risk signals"><div class="signal"><span>Unreviewed admins</span><strong class="score">3</strong></div><div class="signal"><span>Stale tokens</span><strong class="score">18</strong></div><div class="signal"><span>High risk changes</span><strong class="score">5</strong></div><div class="signal"><span>Policy coverage</span><strong class="score">94%</strong></div></aside></section></main></body>
</html>
