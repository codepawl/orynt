profile_id: codepawl_taste_v0
taste_profile_version: 0
priority_order:
  - readability
  - spaciousness
  - hierarchy_clarity
  - alignment_correctness
  - polish
  - contrast_accessibility
defect_weights:
  alignment_clear: high
  spacing_tight: high
  contrast_weak_low_or_medium: low
  contrast_unreadable: high
  hierarchy_weak: low
  hierarchy_action_unclear: high
  generic_ai_slop_usable: high
tie_policy: rare
contrast_policy:
  - contrast is severe only if readability is materially harmed
  - weak-but-readable contrast should not automatically beat spacing/hierarchy problems
spacing_policy:
  - tight spacing is high-impact because it harms visual comfort and scannability
alignment_policy:
  - slight offset is low by default, medium/high in polished contexts
  - visible off-grid alignment is more harmful than weak readable hierarchy
hierarchy_policy:
  - weak hierarchy is low/medium unless CTA or primary content becomes unclear
  - weak readable hierarchy loses less than a clear alignment defect
generic_ai_slop_policy:
  - product-facing severity high even when usable
future_page_profiles:
  - landing
  - dashboard
  - docs
  - pricing
  - settings
  - portfolio
  - onboarding
  - empty_state
