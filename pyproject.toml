[project]
name = "codepawl"
version = "0.1.0"
description = "Research and product foundation for CodePawl Design, Pawl-JEPA, and PawlBench Design."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.14.0",
    "codepawl-harness",
    "codepawl-jitter",
    "codepawl-renderer",
    "huggingface-hub>=1.19.0",
    "pawl-jepa",
    "pawlbench-design",
    "safetensors>=0.8.0",
    "torch>=2.12.0",
    "transformers>=5.12.0",
]

[project.scripts]
codepawl-render = "codepawl_harness.cli:main"
codepawl-jitter = "codepawl_harness.jitter_cli:main"
pawlbench-design-eval = "codepawl_harness.pawlbench_eval_cli:main"
pawlbench-design-embed = "codepawl_harness.pawlbench_embed_cli:main"
pawlbench-design-build = "codepawl_harness.pawlbench_build_cli:main"
pawlbench-design-validate = "codepawl_harness.pawlbench_validate_cli:main"
pawlbench-design-split = "codepawl_harness.pawlbench_split_cli:main"
pawlbench-design-report = "codepawl_harness.pawlbench_report_cli:main"
pawlbench-design-positive-build = "codepawl_harness.pawlbench_positive_build_cli:main"
pawlbench-design-positive-validate = "codepawl_harness.pawlbench_positive_validate_cli:main"
pawlbench-design-positive-report = "codepawl_harness.pawlbench_positive_report_cli:main"
pawlbench-design-vision-embed = "codepawl_harness.pawlbench_vision_embed_cli:main"
pawlbench-design-label-queue = "codepawl_harness.pawlbench_label_queue_cli:main"
pawlbench-design-label-validate = "codepawl_harness.pawlbench_label_validate_cli:main"
pawlbench-design-label-report = "codepawl_harness.pawlbench_label_report_cli:main"
pawlbench-design-label-app = "codepawl_harness.pawlbench_label_app_cli:main"
pawlbench-design-label-suggest = "codepawl_harness.pawlbench_label_suggest_cli:main"
pawlbench-design-label-autofill = "codepawl_harness.pawlbench_label_autofill_cli:main"
pawlbench-design-label-resuggest = "codepawl_harness.pawlbench_label_resuggest_cli:main"
pawlbench-design-label-diff = "codepawl_harness.pawlbench_label_diff_cli:main"
pawlbench-design-label-audit = "codepawl_harness.pawlbench_label_audit_cli:main"
pawlbench-design-label-set-reviewer = "codepawl_harness.pawlbench_label_set_reviewer_cli:main"
pawlbench-design-hard-pairs = "codepawl_harness.pawlbench_hard_pairs_cli:main"
pawlbench-design-generated-pairs = "codepawl_harness.pawlbench_generated_pairs_cli:main"
pawl-jepa-prepare = "codepawl_harness.pawl_jepa_prepare_cli:main"
pawl-jepa-prepare-hard = "codepawl_harness.pawl_jepa_prepare_hard_cli:main"
pawl-jepa-positive-prepare = "codepawl_harness.pawl_jepa_positive_prepare_cli:main"
pawl-jepa-positive-train = "codepawl_harness.pawl_jepa_positive_train_cli:main"
pawl-jepa-positive-eval = "codepawl_harness.pawl_jepa_positive_eval_cli:main"
pawl-jepa-train = "codepawl_harness.pawl_jepa_train_cli:main"
pawl-jepa-eval = "codepawl_harness.pawl_jepa_eval_cli:main"
pawl-jepa-sweep = "codepawl_harness.pawl_jepa_sweep_cli:main"
pawl-jepa-report = "codepawl_harness.pawl_jepa_report_cli:main"
ui-jepa-smoke-build = "codepawl_harness.ui_jepa_smoke_build_cli:main"
ui-jepa-smoke-validate = "codepawl_harness.ui_jepa_smoke_validate_cli:main"
ui-jepa-smoke-b0 = "codepawl_harness.ui_jepa_smoke_b0_cli:main"
ui-jepa-scale-gate = "codepawl_harness.ui_jepa_scale_gate_cli:main"

[project.optional-dependencies]
vision = [
    "pawlbench-design[vision]",
]
jepa = [
    "pawl-jepa[training]",
]

[dependency-groups]
dev = [
    "accelerate>=1.14.0",
    "huggingface-hub>=1.19.0",
    "pytest>=8.0.0",
    "safetensors>=0.8.0",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "transformers>=5.12.0",
]

[tool.uv.workspace]
members = [
    "apps/harness",
    "packages/renderer",
    "packages/metrics",
    "packages/jitter",
    "packages/generators",
    "packages/pawl_jepa",
    "packages/pawlbench_design",
]

[tool.uv.sources]
codepawl-harness = { workspace = true }
codepawl-jitter = { workspace = true }
codepawl-renderer = { workspace = true }
codepawl-metrics = { workspace = true }
pawlbench-design = { workspace = true }
pawl-jepa = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "apps/harness/src",
    "packages/renderer/src",
    "packages/metrics/src",
    "packages/jitter/src",
    "packages/generators/src",
    "packages/pawl_jepa/src",
    "packages/pawlbench_design/src",
]
