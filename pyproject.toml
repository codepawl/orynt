[project]
name = "codepawl"
version = "0.1.0"
description = "Research and product foundation for CodePawl Design, Pawl-JEPA, and PawlBench Design."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "codepawl-harness",
    "codepawl-jitter",
    "codepawl-renderer",
    "pawlbench-design",
]

[project.scripts]
codepawl-render = "codepawl_harness.cli:main"
codepawl-jitter = "codepawl_harness.jitter_cli:main"
pawlbench-design-eval = "codepawl_harness.pawlbench_eval_cli:main"
pawlbench-design-embed = "codepawl_harness.pawlbench_embed_cli:main"
pawlbench-design-build = "codepawl_harness.pawlbench_build_cli:main"
pawlbench-design-validate = "codepawl_harness.pawlbench_validate_cli:main"
pawlbench-design-split = "codepawl_harness.pawlbench_split_cli:main"
pawlbench-design-report = "codepawl_harness.pawlbench_report_cli:main"
pawlbench-design-vision-embed = "codepawl_harness.pawlbench_vision_embed_cli:main"
pawlbench-design-label-queue = "codepawl_harness.pawlbench_label_queue_cli:main"
pawlbench-design-label-validate = "codepawl_harness.pawlbench_label_validate_cli:main"
pawlbench-design-label-report = "codepawl_harness.pawlbench_label_report_cli:main"
pawlbench-design-label-app = "codepawl_harness.pawlbench_label_app_cli:main"
pawlbench-design-label-suggest = "codepawl_harness.pawlbench_label_suggest_cli:main"
pawlbench-design-label-audit = "codepawl_harness.pawlbench_label_audit_cli:main"
pawlbench-design-label-set-reviewer = "codepawl_harness.pawlbench_label_set_reviewer_cli:main"

[project.optional-dependencies]
vision = [
    "pawlbench-design[vision]",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.workspace]
members = [
    "apps/harness",
    "packages/renderer",
    "packages/metrics",
    "packages/jitter",
    "packages/generators",
    "packages/pawl_jepa",
    "packages/pawlbench_design",
]

[tool.uv.sources]
codepawl-harness = { workspace = true }
codepawl-jitter = { workspace = true }
codepawl-renderer = { workspace = true }
codepawl-metrics = { workspace = true }
pawlbench-design = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "apps/harness/src",
    "packages/renderer/src",
    "packages/metrics/src",
    "packages/jitter/src",
    "packages/generators/src",
    "packages/pawl_jepa/src",
    "packages/pawlbench_design/src",
]
