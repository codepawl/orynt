name: Openpawl

on:
  workflow_dispatch:

jobs:
  openpawl:
    name: Openpawl Agent Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Openpawl
        uses: codepawl/openpawl@main
