name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 2"

permissions:
  contents: read
  security-events: write
  # `analyze` reads the workflow run it belongs to. Without this the step ends
  # with "Resource not accessible by integration" against
  # GET /repos/{owner}/{repo}/actions/runs/{run_id}, after the scan itself has
  # already succeeded.
  actions: read

jobs:
  analyze:
    # Code scanning needs GitHub Advanced Security, which this repository does
    # not have while it is private. The scan itself succeeds and only the
    # upload fails, so a private run reports a failure nobody can act on. The
    # job starts working on its own once the repository becomes public, which
    # is the point where docs/release/github-publication.md turns code scanning
    # on and requires this check.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@a2983b8bed1923f44751c5c43237f479442827b3 # v3
