name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  web:
    name: Web (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun --filter @codepawl/web typecheck
      - run: bun --filter @codepawl/web lint
      - run: bun --filter @codepawl/web test
      - run: bun --filter @codepawl/web build

  api:
    name: API (uv)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run mypy .
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
