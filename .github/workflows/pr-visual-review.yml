name: PR Visual Review

"on":
  workflow_dispatch:
    inputs:
      review_id:
        description: Output directory suffix under reports/ui_pr_review_v0.
        required: false
        default: codepawl_web_pilot
      upload_artifacts:
        description: Upload the artifact-only review bundle.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: /tmp/uv-cache
      GATE_OUT: reports/ui_jepa_v0_smoke/scale_gate_pr_review.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install locked workspace
        run: uv sync --frozen

      - name: Run artifact-only PR visual review
        run: |
          uv run ui-pr-review-ci \
            --target pr-review \
            --out "reports/ui_pr_review_v0/${{ inputs.review_id }}" \
            --gate-out "$GATE_OUT" \
            --reviewer-id github-actions

      - name: Validate artifact contract
        run: |
          uv run ui-pr-review-ci \
            --validate-only \
            --target pr-review \
            --out "reports/ui_pr_review_v0/${{ inputs.review_id }}" \
            --gate-out "$GATE_OUT"

      - name: Upload visual review artifacts
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: codepawl-pr-visual-review
          path: |
            reports/ui_pr_review_v0/${{ inputs.review_id }}/
            reports/ui_jepa_v0_smoke/scale_gate_pr_review.json
            reports/ui_pr_review_v0/real_pr_trial/trial_report.json
            reports/ui_pr_review_v0/real_pr_trial/trial_report.md
          if-no-files-found: error
