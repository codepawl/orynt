name: LSP soak

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install pinned Rust Analyzer toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rust-analyzer
      - run: bun run test:lsp
        env:
          ORYNT_TEST_RUST_LSP: "1"
          RUSTUP_TOOLCHAIN: "1.97.0"
      - run: bun run soak:lsp > lsp-soak.json
        env:
          RUSTUP_TOOLCHAIN: "1.97.0"
          ORYNT_SOURCE_DIGEST: ${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lsp-soak
          path: lsp-soak.json
          if-no-files-found: error
