name: CI API

on:
  pull_request:
    paths:
      - "apps/api/**"
  push:
    branches: [main, staging]
    paths:
      - "apps/api/**"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements-dev.txt

      - name: Lint
        run: cd apps/api && ruff check .

      - name: Test
        run: cd apps/api && pytest tests/ -v

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Koyeb redeploy
        env:
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
          KOYEB_SERVICE_ID: ${{ secrets.KOYEB_SERVICE_ID }}
        run: |
          curl -s -X POST \
            "https://app.koyeb.com/v1/services/${KOYEB_SERVICE_ID}/redeploy" \
            -H "Authorization: Bearer ${KOYEB_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"use_cache": false}'
