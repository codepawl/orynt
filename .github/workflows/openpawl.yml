name: Openpawl CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      task:
        description: "Coding task for Openpawl to execute"
        required: false
        default: "review changes and suggest improvements"
      repo_path:
        description: "Path to the target repository from the checkout root"
        required: false
        default: "."
      mode:
        description: "Run mode"
        required: false
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - write

jobs:
  openpawl-run:
    name: Openpawl Agent Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck Openpawl packages
        run: bun run typecheck:core && bun run typecheck:cli

      - name: Determine task and mode
        id: config
        env:
          DISPATCH_TASK: ${{ github.event.inputs.task }}
          DISPATCH_REPO_PATH: ${{ github.event.inputs.repo_path }}
          DISPATCH_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TASK="Review and analyse the changes in this pull request"
            REPO_PATH="."
            MODE="dry-run"
          else
            TASK="${DISPATCH_TASK:-review changes and suggest improvements}"
            REPO_PATH="${DISPATCH_REPO_PATH:-.}"
            MODE="${DISPATCH_MODE:-dry-run}"
          fi

          case "$MODE" in
            dry-run|write) ;;
            *)
              echo "Invalid mode: $MODE" >&2
              exit 1
              ;;
          esac

          {
            echo "task<<EOF"
            echo "$TASK"
            echo "EOF"
            echo "repo_path=$REPO_PATH"
            echo "mode=$MODE"
          } >> "$GITHUB_OUTPUT"

          echo "Task: $TASK"
          echo "Repo path: $REPO_PATH"
          echo "Mode: $MODE"

      - name: Run Openpawl agent
        id: openpawl
        env:
          OPENPAWL_TASK: ${{ steps.config.outputs.task }}
          OPENPAWL_REPO_PATH: ${{ steps.config.outputs.repo_path }}
          OPENPAWL_MODE: ${{ steps.config.outputs.mode }}
        run: |
          set +e

          if [ "$OPENPAWL_MODE" = "write" ]; then
            bun run dev:cli -- run \
              --repo "$OPENPAWL_REPO_PATH" \
              --task "$OPENPAWL_TASK" \
              --write \
              --test-cmd "bun run test"
          else
            bun run dev:cli -- run \
              --repo "$OPENPAWL_REPO_PATH" \
              --task "$OPENPAWL_TASK" \
              --dry-run \
              --test-cmd "echo skip"
          fi
          EXIT_CODE=$?
          set -e
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          # Capture the latest run ID
          RUN_DIR=$(ls -td .codepawl/runs/run_* 2>/dev/null | head -1)
          if [ -n "$RUN_DIR" ]; then
            RUN_ID=$(basename "$RUN_DIR")
            echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
            echo "run_dir=${RUN_DIR}" >> "$GITHUB_OUTPUT"
            echo "report_path=${RUN_DIR}/report.md" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Upload Openpawl run artifacts
        if: always() && steps.openpawl.outputs.run_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: openpawl-run-${{ steps.openpawl.outputs.run_id }}
          path: ${{ steps.openpawl.outputs.run_dir }}/**
          if-no-files-found: error
          retention-days: 30

      - name: Post report as PR comment
        if: |
          always() &&
          github.event_name == 'pull_request' &&
          steps.openpawl.outputs.report_path != '' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reportPath = '${{ steps.openpawl.outputs.report_path }}';

            if (!fs.existsSync(reportPath)) {
              console.log('No report found at', reportPath);
              return;
            }

            const report = fs.readFileSync(reportPath, 'utf8');
            const runId = '${{ steps.openpawl.outputs.run_id }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report,
            });

            console.log(`✅ Posted Openpawl report for run ${runId}`);

      - name: Skip PR comment on forked pull requests
        if: |
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: echo "Skipping Openpawl PR comment because this pull request comes from a fork."

      - name: Fail if Openpawl run failed
        if: always() && steps.openpawl.outputs.exit_code != '0'
        run: |
          echo "Openpawl exited with code ${{ steps.openpawl.outputs.exit_code }}."
          echo "Artifacts were uploaded when available."
          exit 1

  unit-tests:
    name: Unit Tests (core + cli)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck:core && bun run typecheck:cli

      - name: Run core tests
        run: bun run test:core

      - name: Run CLI tests
        run: bun run test:cli
