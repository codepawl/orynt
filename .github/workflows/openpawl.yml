name: Openpawl CI

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      task:
        description: "Coding task for Openpawl to execute"
        required: false
        default: "review changes and suggest improvements"
      repo_path:
        description: "Path to the target repository from the checkout root"
        required: false
        default: "."
      mode:
        description: "Run mode"
        required: false
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - write

jobs:
  openpawl-run:
    name: Openpawl Agent Run
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout Openpawl source
        uses: actions/checkout@v6
        with:
          repository: codepawl/openpawl
          ref: v0.5.1
          path: .openpawl-src

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Openpawl release dependencies
        run: bun install
        working-directory: .openpawl-src

      - name: Typecheck Openpawl release packages
        run: bun run typecheck:core && bun run typecheck:cli
        working-directory: .openpawl-src

      - name: Resolve Openpawl trigger
        id: trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          OPENPAWL_TASK: ${{ github.event.inputs.task }}
          OPENPAWL_REPO_PATH: ${{ github.event.inputs.repo_path }}
          OPENPAWL_MODE: ${{ github.event.inputs.mode }}
          OPENPAWL_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            bun --cwd .openpawl-src --filter @codepawl/cli dev -- openpawl-trigger \
              --event-name "$EVENT_NAME" \
              --event-path "${GITHUB_EVENT_PATH}" \
              --workflow-task "${OPENPAWL_TASK}" \
              --workflow-repo-path "${OPENPAWL_REPO_PATH}" \
              --workflow-mode "${OPENPAWL_MODE}" \
              --workflow-repository "${OPENPAWL_REPOSITORY}"
          else
            bun --cwd .openpawl-src --filter @codepawl/cli dev -- openpawl-trigger \
              --event-name "$EVENT_NAME" \
              --event-path "${GITHUB_EVENT_PATH}" \
              --workflow-repository "${OPENPAWL_REPOSITORY}"
          fi

      - name: Checkout base ref for approved write
        if: steps.trigger.outputs.approved_write == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.trigger.outputs.base_ref }}
          clean: false

      - name: Install target dependencies for approved write checkout
        if: steps.trigger.outputs.approved_write == 'true'
        run: bun install

      - name: Run Openpawl agent
        id: openpawl
        if: steps.trigger.outputs.should_run == 'true'
        env:
          OPENPAWL_TASK: ${{ steps.trigger.outputs.task }}
          OPENPAWL_REPO_PATH: ${{ steps.trigger.outputs.repo_path }}
          OPENPAWL_MODE: ${{ steps.trigger.outputs.mode }}
          OPENPAWL_GITHUB_ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e

          if [ "$OPENPAWL_MODE" = "write" ]; then
            bun --cwd .openpawl-src --filter @codepawl/cli dev -- run \
              --repo "$GITHUB_WORKSPACE/$OPENPAWL_REPO_PATH" \
              --task "$OPENPAWL_TASK" \
              --write
          else
            bun --cwd .openpawl-src --filter @codepawl/cli dev -- run \
              --repo "$GITHUB_WORKSPACE/$OPENPAWL_REPO_PATH" \
              --task "$OPENPAWL_TASK" \
              --dry-run
          fi
          EXIT_CODE=$?
          set -e
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          # Capture the latest run ID from the target repository.
          RUN_DIR=$(ls -td "$GITHUB_WORKSPACE/$OPENPAWL_REPO_PATH"/.codepawl/runs/run_* 2>/dev/null | head -1)
          if [ -n "$RUN_DIR" ]; then
            RUN_DIR=$(realpath "$RUN_DIR")
            RUN_ID=$(basename "$RUN_DIR")
            echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
            echo "run_dir=${RUN_DIR}" >> "$GITHUB_OUTPUT"
            echo "report_path=${RUN_DIR}/report.md" >> "$GITHUB_OUTPUT"
            echo "trace_path=${RUN_DIR}/trace.json" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Upload Openpawl run artifacts
        if: always() && steps.openpawl.outputs.run_dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: openpawl-artifacts-${{ steps.openpawl.outputs.run_id }}
          path: ${{ steps.openpawl.outputs.run_dir }}/**
          if-no-files-found: error
          retention-days: 30

      - name: Post report as PR comment
        if: |
          always() &&
          steps.trigger.outputs.should_run == 'true' &&
          steps.openpawl.outputs.report_path != '' &&
          steps.trigger.outputs.issue_number != ''
        uses: actions/github-script@v9
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reportPath = '${{ steps.openpawl.outputs.report_path }}';
            const issueNumber = Number('${{ steps.trigger.outputs.issue_number }}');
            const isPullRequest = '${{ steps.trigger.outputs.issue_is_pull_request }}' === 'true';
            const baseRepo = '${{ steps.trigger.outputs.base_repo_full_name }}' || `${context.repo.owner}/${context.repo.repo}`;
            const headRepo = '${{ steps.trigger.outputs.head_repo_full_name }}';

            if (!fs.existsSync(reportPath)) {
              console.log('No report found at', reportPath);
              return;
            }

            if (!Number.isFinite(issueNumber)) {
              console.log('Skipping Openpawl comment because no issue number was resolved.');
              return;
            }

            if (isPullRequest) {
              const pull = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: issueNumber,
              });
              const pullHeadRepo = pull.data.head?.repo?.full_name;
              const resolvedHeadRepo = headRepo || pullHeadRepo;
              if (resolvedHeadRepo && resolvedHeadRepo !== baseRepo) {
                console.log('Skipping Openpawl PR comment because this run is from a forked pull request.');
                return;
              }
            }

            const report = fs.readFileSync(reportPath, 'utf8');
            const runId = '${{ steps.openpawl.outputs.run_id }}';
            const runDir = '${{ steps.openpawl.outputs.run_dir }}';
            const tracePath = '${{ steps.openpawl.outputs.trace_path }}';
            const actionsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactName = runId ? `openpawl-artifacts-${runId}` : 'openpawl-artifacts';
            const evidenceContext = [
              '## GitHub Run Context',
              `- Run ID: \`${runId || 'unknown'}\``,
              `- Actions run: ${actionsUrl}`,
              `- Artifact: \`${artifactName}\``,
              `- Artifact directory: \`${runDir || 'unknown'}\``,
              `- Report path: \`${reportPath}\``,
              tracePath ? `- Trace path: \`${tracePath}\`` : '',
              '',
            ].filter(Boolean).join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `${evidenceContext}\n${report}`,
            });

            console.log(`✅ Posted Openpawl report for run ${runId}`);

      - name: Create approved Openpawl apply PR
        if: |
          always() &&
          steps.trigger.outputs.approved_write == 'true' &&
          steps.openpawl.outputs.exit_code == '0' &&
          steps.openpawl.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.trigger.outputs.issue_number }}
          SOURCE_TITLE: ${{ steps.trigger.outputs.source_title }}
          BASE_REF: ${{ steps.trigger.outputs.base_ref }}
          RUN_ID: ${{ steps.openpawl.outputs.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          rm -rf .openpawl-src

          if [ -z "$(git status --porcelain --untracked-files=normal)" ]; then
            echo "No approved Openpawl file changes found; skipping PR creation."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="openpawl/apply-${ISSUE_NUMBER}-${RUN_ID}"
          git checkout -B "$BRANCH_NAME"
          git add -A
          git commit -m "chore: apply openpawl changes for #${ISSUE_NUMBER}"
          git push --force-with-lease origin "$BRANCH_NAME"

          printf '%s\n' \
            "Openpawl approved write run created this branch." \
            "" \
            "Source: #${ISSUE_NUMBER}" \
            "Run ID: ${RUN_ID}" \
            "Validation: passed" \
            "Artifact: openpawl-artifacts-${RUN_ID}" \
            "Workflow: ${RUN_URL}" \
            "" \
            "Refs #${ISSUE_NUMBER}" \
            > /tmp/openpawl-pr-body.md

          PR_OUTPUT=$(mktemp)
          MANUAL_PR_URL="https://github.com/${{ github.repository }}/compare/${BASE_REF}...${BRANCH_NAME}?expand=1"
          MANUAL_PR_CMD="gh pr create --repo \"${{ github.repository }}\" --base \"${BASE_REF}\" --head \"${BRANCH_NAME}\" --title \"Openpawl apply for #${ISSUE_NUMBER}: ${SOURCE_TITLE}\" --body-file /tmp/openpawl-pr-body.md"
          if gh pr create \
            --base "$BASE_REF" \
            --head "$BRANCH_NAME" \
            --title "Openpawl apply for #${ISSUE_NUMBER}: ${SOURCE_TITLE}" \
            --body-file /tmp/openpawl-pr-body.md \
            > "$PR_OUTPUT" 2>&1; then
            echo "✅ Openpawl PR created for run ${RUN_ID}."
            rm -f "$PR_OUTPUT"
          else
            PR_EXIT_CODE=$?
            if grep -qi "is not permitted to create or approve pull requests" "$PR_OUTPUT"; then
              echo "::warning title=Openpawl PR creation blocked::Openpawl write run completed and pushed branch ${BRANCH_NAME}, but organization policy blocks GitHub Actions PR creation."
              echo "Openpawl branch: ${BRANCH_NAME}"
              echo "Branch compare link: ${MANUAL_PR_URL}"
              echo "Manual PR command:"
              echo "${MANUAL_PR_CMD}"

              printf '%s\n' \
                "Openpawl write run ${RUN_ID} succeeded and pushed branch ${BRANCH_NAME}." \
                "" \
                "Automatic PR creation was blocked by organization policy: GitHub Actions is not permitted to create or approve pull requests." \
                "" \
                "To continue, create the PR manually:" \
                "- Compare URL: ${MANUAL_PR_URL}" \
                "- CLI command:" \
                "  ${MANUAL_PR_CMD}" \
                > /tmp/openpawl-manual-pr.md

              if [ -n "${ISSUE_NUMBER}" ] && [ -n "${GITHUB_TOKEN}" ]; then
                if gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/openpawl-manual-pr.md; then
                  echo "✅ Posted manual-PR fallback note to issue #${ISSUE_NUMBER}."
                else
                  echo "::warning::Unable to post fallback PR instructions comment on issue #${ISSUE_NUMBER}."
                fi
              fi
              rm -f "$PR_OUTPUT" /tmp/openpawl-manual-pr.md
              exit 0
            fi

            echo "Openpawl PR creation failed with unexpected error for run ${RUN_ID}."
            cat "$PR_OUTPUT"
            rm -f "$PR_OUTPUT"
            exit "$PR_EXIT_CODE"
          fi

      - name: Fail if Openpawl run failed
        if: |
          always() &&
          steps.trigger.outputs.should_run == 'true' &&
          steps.openpawl.outputs.exit_code != '0'
        run: |
          echo "Openpawl exited with code ${{ steps.openpawl.outputs.exit_code }}."
          echo "Artifacts were uploaded when available."
          exit 1

  unit-tests:
    name: Openpawl Release Tests (core + cli)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Openpawl source
        uses: actions/checkout@v6
        with:
          repository: codepawl/openpawl
          ref: v0.5.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck:core && bun run typecheck:cli

      - name: Run core tests
        run: bun run test:core

      - name: Run CLI tests
        run: bun run test:cli
