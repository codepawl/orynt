name: Openpawl CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      task:
        description: "Coding task for Openpawl to execute"
        required: false
        default: "review changes and suggest improvements"
      mode:
        description: "Run mode: dry-run or write"
        required: false
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - write

jobs:
  openpawl-run:
    name: Openpawl Agent Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: bun run build --filter @codepawl/core --filter @codepawl/cli 2>/dev/null || true

      - name: Determine task and mode
        id: config
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TASK="Review and analyse the changes in this pull request"
            MODE="dry-run"
          else
            TASK="${{ github.event.inputs.task }}"
            MODE="${{ github.event.inputs.mode }}"
          fi
          echo "task=${TASK}" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"

      - name: Run Openpawl agent
        id: openpawl
        run: |
          if [ "${{ steps.config.outputs.mode }}" = "write" ]; then
            bun packages/cli/src/bin.ts run \
              --repo . \
              --task "${{ steps.config.outputs.task }}" \
              --write \
              --test-cmd "bun run test" \
            || true
          else
            bun packages/cli/src/bin.ts run \
              --repo . \
              --task "${{ steps.config.outputs.task }}" \
              --dry-run \
              --test-cmd "echo skip" \
            || true
          fi

          # Capture the latest run ID
          RUN_DIR=$(ls -td .codepawl/runs/run_* 2>/dev/null | head -1)
          if [ -n "$RUN_DIR" ]; then
            RUN_ID=$(basename "$RUN_DIR")
            echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
            echo "run_dir=${RUN_DIR}" >> "$GITHUB_OUTPUT"
            echo "report_path=${RUN_DIR}/report.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Openpawl run artifacts
        if: steps.openpawl.outputs.run_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: openpawl-run-${{ steps.openpawl.outputs.run_id }}
          path: ${{ steps.openpawl.outputs.run_dir }}/
          retention-days: 30

      - name: Post report as PR comment
        if: |
          github.event_name == 'pull_request' &&
          steps.openpawl.outputs.report_path != '' &&
          github.token != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reportPath = '${{ steps.openpawl.outputs.report_path }}';

            if (!fs.existsSync(reportPath)) {
              console.log('No report found at', reportPath);
              return;
            }

            const report = fs.readFileSync(reportPath, 'utf8');
            const runId = '${{ steps.openpawl.outputs.run_id }}';

            // Find and delete any previous Openpawl comment on this PR
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const comment of comments) {
              if (comment.body && comment.body.includes('Openpawl Agent Run Report')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            // Post the new report
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report,
            });

            console.log(`✅ Posted Openpawl report for run ${runId}`);

  unit-tests:
    name: Unit Tests (core + cli)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck:core && bun run typecheck:cli

      - name: Run core tests
        run: bun run test:core

      - name: Run CLI tests
        run: bun run test:cli
