name: Openpawl CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      task:
        description: "Coding task for Openpawl to execute"
        required: false
        default: "review changes and suggest improvements"
      repo_path:
        description: "Path to the target repository from the checkout root"
        required: false
        default: "."
      mode:
        description: "Run mode"
        required: false
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - write

jobs:
  openpawl-run:
    name: Openpawl Agent Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck Openpawl packages
        run: bun run typecheck:core && bun run typecheck:cli

      - name: Resolve Openpawl trigger
        id: trigger
        env:
          OPENPAWL_TASK: ${{ github.event.inputs.task }}
          OPENPAWL_REPO_PATH: ${{ github.event.inputs.repo_path }}
          OPENPAWL_MODE: ${{ github.event.inputs.mode }}
          OPENPAWL_REPOSITORY: ${{ github.repository }}
        run: |
          bun run dev:cli -- openpawl-trigger \
            --event-name "${{ github.event_name }}" \
            --event-path "${GITHUB_EVENT_PATH}" \
            --workflow-task "${OPENPAWL_TASK}" \
            --workflow-repo-path "${OPENPAWL_REPO_PATH}" \
            --workflow-mode "${OPENPAWL_MODE}" \
            --workflow-repository "${OPENPAWL_REPOSITORY}"

      - name: Run Openpawl agent
        id: openpawl
        if: steps.trigger.outputs.should_run == 'true'
        env:
          OPENPAWL_TASK: ${{ steps.trigger.outputs.task }}
          OPENPAWL_REPO_PATH: ${{ steps.trigger.outputs.repo_path }}
          OPENPAWL_MODE: ${{ steps.trigger.outputs.mode }}
        run: |
          set +e

          if [ "$OPENPAWL_MODE" = "write" ]; then
            bun run dev:cli -- run \
              --repo "$OPENPAWL_REPO_PATH" \
              --task "$OPENPAWL_TASK" \
              --write \
              --test-cmd "bun run test"
          else
            bun run dev:cli -- run \
              --repo "$OPENPAWL_REPO_PATH" \
              --task "$OPENPAWL_TASK" \
              --dry-run \
              --test-cmd "echo skip"
          fi
          EXIT_CODE=$?
          set -e
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          # Capture the latest run ID
          RUN_DIR=$(ls -td .codepawl/runs/run_* 2>/dev/null | head -1)
          if [ -n "$RUN_DIR" ]; then
            RUN_ID=$(basename "$RUN_DIR")
            echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
            echo "run_dir=${RUN_DIR}" >> "$GITHUB_OUTPUT"
            echo "report_path=${RUN_DIR}/report.md" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Upload Openpawl run artifacts
        if: always() && steps.openpawl.outputs.run_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: openpawl-artifacts-${{ steps.openpawl.outputs.run_id }}
          path: ${{ steps.openpawl.outputs.run_dir }}/**
          if-no-files-found: error
          retention-days: 30

      - name: Post report as PR comment
        if: |
          always() &&
          steps.trigger.outputs.should_run == 'true' &&
          steps.openpawl.outputs.report_path != '' &&
          steps.trigger.outputs.issue_number != ''
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reportPath = '${{ steps.openpawl.outputs.report_path }}';
            const issueNumber = Number('${{ steps.trigger.outputs.issue_number }}');
            const isPullRequest = '${{ steps.trigger.outputs.issue_is_pull_request }}' === 'true';
            const baseRepo = '${{ steps.trigger.outputs.base_repo_full_name }}' || `${context.repo.owner}/${context.repo.repo}`;
            const headRepo = '${{ steps.trigger.outputs.head_repo_full_name }}';

            if (!fs.existsSync(reportPath)) {
              console.log('No report found at', reportPath);
              return;
            }

            if (!Number.isFinite(issueNumber)) {
              console.log('Skipping Openpawl comment because no issue number was resolved.');
              return;
            }

            if (isPullRequest) {
              const pull = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: issueNumber,
              });
              const pullHeadRepo = pull.data.head?.repo?.full_name;
              const resolvedHeadRepo = headRepo || pullHeadRepo;
              if (resolvedHeadRepo && resolvedHeadRepo !== baseRepo) {
                console.log('Skipping Openpawl PR comment because this run is from a forked pull request.');
                return;
              }
            }

            const report = fs.readFileSync(reportPath, 'utf8');
            const runId = '${{ steps.openpawl.outputs.run_id }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: report,
            });

            console.log(`✅ Posted Openpawl report for run ${runId}`);

      - name: Fail if Openpawl run failed
        if: |
          always() &&
          steps.trigger.outputs.should_run == 'true' &&
          steps.openpawl.outputs.exit_code != '0'
        run: |
          echo "Openpawl exited with code ${{ steps.openpawl.outputs.exit_code }}."
          echo "Artifacts were uploaded when available."
          exit 1

  unit-tests:
    name: Unit Tests (core + cli)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck:core && bun run typecheck:cli

      - name: Run core tests
        run: bun run test:core

      - name: Run CLI tests
        run: bun run test:cli
