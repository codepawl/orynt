name: Internal desktop package

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:desktop:check
      - run: pnpm package:desktop:internal
      - uses: actions/upload-artifact@v4
        with:
          name: orynt-internal-desktop
          path: dist/private-beta/**
          if-no-files-found: error
          retention-days: 14
